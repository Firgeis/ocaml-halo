name: release-source

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to package
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      archive_name: ${{ steps.meta.outputs.archive_name }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine release version
        id: meta
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "${version}" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          archive_name="ocaml-halo-${version}.tar.gz"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive_name=${archive_name}" >> "${GITHUB_OUTPUT}"

      - name: Fetch vendored sources
        run: make vendor-fetch

      - name: Build source archive
        run: make release-source-artifact VERSION="${{ steps.meta.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.archive_name }}
          path: dist/${{ steps.meta.outputs.archive_name }}

      - name: Publish release asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.meta.outputs.archive_name }}

  verify:
    needs: package
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.archive_name }}
          path: dist

      - uses: avsm/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.0

      - name: Install OpenSSL toolchain on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 pkg-config
          openssl_prefix="$(brew --prefix openssl@3)"
          echo "CPATH=${openssl_prefix}/include${CPATH:+:${CPATH}}" >> "${GITHUB_ENV}"
          echo "LIBRARY_PATH=${openssl_prefix}/lib${LIBRARY_PATH:+:${LIBRARY_PATH}}" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_PATH=${openssl_prefix}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "${GITHUB_ENV}"

      - name: Extract source archive
        run: tar -xzf "dist/${{ needs.package.outputs.archive_name }}"

      - name: Install package dependencies
        run: opam install "./ocaml-halo-${{ needs.package.outputs.version }}" --deps-only -y

      - name: Verify library build from release tarball
        run: opam exec -- dune build --root "./ocaml-halo-${{ needs.package.outputs.version }}" @install
